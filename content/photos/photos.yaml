# TNT photo manifest — every photo on the site is listed here.
#
# To add a photo: drop the image into the right season folder (or misc/), then
# add an entry below. `npm run check-data` warns about any photo on disk that
# isn't listed here, and errors on typo'd player slugs or missing files.
#
# Fields:
#   file:     path relative to content/photos/
#   players:  player slugs tagged in the photo — it appears on each one's page
#   season:   1-5; the photo shows in that season's gallery. Omit if unknown.
#   caption:  optional, shown under the photo. Leave blank for none.
#
# Order matters: galleries show photos in the order listed here, and a player's
# avatar is their first solo-tagged photo (falling back to first tagged).


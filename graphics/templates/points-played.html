<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TNT — Points Played Record (A / Broadsheet)</title>
<link rel="stylesheet" href="./_tokens.css">
<link rel="stylesheet" href="./_fonts.css">
<link rel="stylesheet" href="./_assets.css">
<link rel="stylesheet" href="./_base.css">
<link rel="stylesheet" href="./_theme.css">
<style>
  /* Same build as the tiebreak record: the record holder's photo takes the
     top half and fades into the court green, the headline sits on that fade,
     and the table runs underneath with the record row lit in gold. A player
     who moved mid-season gets a split bar, one team colour above the other. */
  .canvas { padding: 0; }

  .photo {
    position: absolute; z-index: 0; left: 0; right: 0; top: 0; height: 800px;
    background: linear-gradient(168deg, #14281c 0%, var(--ink) 70%) center 26%/cover no-repeat;
  }
  .photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(5,11,7,0.70) 0%, rgba(5,11,7,0.10) 20%, rgba(5,11,7,0.06) 44%,
      rgba(10,19,13,0.82) 76%, var(--ink) 100%);
  }

  .top {
    position: absolute; z-index: 3; left: var(--safe); right: var(--safe); top: 52px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .top .eyebrow { font-size: 22px; letter-spacing: 0.4em; }
  .top .mark { width: 60px; color: var(--gold); flex: none; }

  .body {
    position: absolute; z-index: 3; left: var(--safe); right: var(--safe);
    top: 590px; bottom: var(--crop);
    display: flex; flex-direction: column;
  }
  .headline { font-size: 68px; line-height: 0.98; text-shadow: 0 2px 24px rgba(0,0,0,0.55); }
  .sub {
    margin-top: 16px; font-size: 27px; letter-spacing: 0.02em; text-transform: none;
    color: rgba(244, 241, 232, 0.82);
  }
  .rule-gold {
    height: 2px; margin-top: 22px; flex: none;
    background: linear-gradient(90deg, var(--gold), rgba(217,185,106,0.06) 78%, transparent);
  }

  .rows { flex: 1; display: flex; flex-direction: column; padding-top: 8px; }
  .row {
    flex: 1; display: grid; align-items: center;
    grid-template-columns: 72px 8px 1fr auto 150px; gap: 0 22px;
    border-top: 1px solid var(--rule); position: relative;
  }
  .row:first-child { border-top: 0; }
  .row > * { position: relative; z-index: 1; }
  .row.featured + .row { border-top-color: transparent; }
  .row.featured::before {
    content: ''; position: absolute; inset: 0 calc(var(--safe) * -1) 0 -18px;
    background: linear-gradient(90deg, rgba(217,185,106,0.24), rgba(217,185,106,0.06) 64%, rgba(217,185,106,0.02));
  }
  .row.featured::after {
    content: ''; position: absolute; left: -18px; top: 0; bottom: 0; width: 6px; background: var(--gold);
  }

  .rank {
    font-family: var(--display); font-weight: 600; font-size: 36px; text-align: center;
    color: rgba(244, 241, 232, 0.55);
  }
  .row.featured .rank { color: var(--gold); font-size: 46px; }
  .bars { display: flex; flex-direction: column; gap: 4px; height: 52px; }
  .bar { flex: 1; width: 8px; border-radius: 4px; background: linear-gradient(180deg, var(--team), var(--team-2)); }
  .who { min-width: 0; }
  .who .name { font-size: 31px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .who .s {
    margin-left: 10px; font-size: 19px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(244, 241, 232, 0.45);
  }
  .who .s { display: block; margin: 6px 0 0; }
  .who .teams { margin-top: 4px; font-size: 22px; color: rgba(244, 241, 232, 0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.featured .who .name { font-size: 36px; }
  .row.featured .who .s { color: var(--gold-soft); }
  .row.featured .who .teams { color: rgba(244, 241, 232, 0.8); }

  .wl { text-align: right; line-height: 1; }
  .wl .n { font-size: 27px; font-weight: 600; color: rgba(244, 241, 232, 0.78); }
  .wl .l, .count .l {
    display: block; margin-top: 3px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244, 241, 232, 0.4);
  }

  .count { text-align: right; line-height: 1; }
  .count .n { font-size: 50px; font-weight: 700; color: rgba(244, 241, 232, 0.88); }

  .row.featured .count .n { font-size: 66px; color: var(--gold); }

  .row.featured .count .l { color: var(--gold-soft); }

  /* `.canvas > footer`, not `footer`: the theme's `.canvas > *` would win. */
  .canvas > footer {
    position: absolute; z-index: 3; left: var(--safe); right: var(--safe); bottom: 54px;
  }
  .wordmark {
    font-family: var(--display); font-weight: 600; font-size: 21px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold);
  }
</style>
</head>
<body>
<div class="canvas grain vignette">
  <div class="photo" id="photo"></div>

  <div class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="mark mark--crest"></div>
  </div>

  <div class="body">
    <h1 class="headline" id="title"></h1>
    <div class="sub" id="subtitle"></div>
    <div class="rule-gold"></div>
    <div class="rows" id="rows"></div>
  </div>

  <footer><div class="wordmark">Tuesday Night Tennis</div></footer>
</div>

<script type="module">
/* Sample data, so this file opens straight in a browser and looks like the
   real thing. `render.mjs` calls __render() again with the CSV's numbers. */
const row = (rank, player, when, teams, points, matches, perMatch, featured = false) =>
  ({ rank, player, when, teams, points, matches, perMatch, featured });
const DATA = {
  eyebrow: 'All-time · Home & away',
  title: 'Most Points Played in a Season',
  subtitle: 'A. Hume: 590 points across 9 matches',
  footnote: '',
  photo: '../../content/photos/season-5/angus-forehand.JPG',
  rows: [
    row(1, 'Angus Hume', 'Season 5', ['Black', 'Green'], 590, 9, '65.6', true),
    row(2, 'Lachlan Jenkin', 'Season 5', ['Red'], 586, 8, '73.3'),
    row(3, 'Will Mumme', 'Season 5', ['Navy'], 534, 8, '66.8'),
    row(4, 'Will Mumme', 'Season 4', ['Yellow'], 525, 8, '65.6'),
    row(5, 'Quinn Feikema', 'Season 5', ['Green'], 520, 8, '65.0'),
    row(6, 'Emerson Wise', 'Season 4', ['Black'], 507, 8, '63.4'),
  ],
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

window.__render = function (d) {
  document.getElementById('eyebrow').textContent = d.eyebrow;
  document.getElementById('title').textContent = d.title;
  document.getElementById('subtitle').textContent = d.subtitle;
  document.getElementById('photo').style.backgroundImage = d.photo ? `url("${d.photo}")` : '';

  document.getElementById('rows').innerHTML = d.rows.map((r) => `
    <div class="row ${r.featured ? 'featured' : ''}">
      <div class="rank">${r.rank}</div>
      <div class="bars">${r.teams.map((t) => `<div class="bar" data-team="${esc(t)}"></div>`).join('')}</div>
      <div class="who">
        <div class="name">${esc(r.player)}</div>
        <div class="teams">${esc(r.when)} · ${r.teams.map(esc).join(' → ')}</div>
      </div>
      <div class="wl"><span class="n">${esc(r.perMatch)}</span><span class="l">Per match</span></div>
      <div class="count"><span class="n">${r.points}</span><span class="l">${r.matches} matches</span></div>
    </div>`).join('');
};

if (location.search.includes('guides')) document.body.classList.add('guides');
window.__render(DATA);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TNT — Finals tie: trading cards</title>
<link rel="stylesheet" href="./_tokens.css">
<link rel="stylesheet" href="./_fonts.css">
<link rel="stylesheet" href="./_assets.css">
<link rel="stylesheet" href="./_base.css">
<link rel="stylesheet" href="./_theme.css">
<style>
  /* Two trading cards, one a pair, squared up across the middle of the
     frame. The card's name plate carries the record and the form, so
     nothing else on the poster has to. Same payload as tie-preview.html.
     Cutouts are placed by head and height (see "Cutouts" in
     graphics/README.md). */

  .canvas {
    background:
      radial-gradient(ellipse 70% 40% at 50% 54%, rgba(217, 185, 106, 0.12), transparent 70%),
      linear-gradient(168deg, #14281c 0%, var(--ink) 50%, var(--ink-deep) 100%);
  }
  /* Rays behind the cards. */
  .rays {
    position: absolute; inset: 0; z-index: 0; opacity: 0.07;
    background: repeating-conic-gradient(from 0deg at 50% 54%, var(--gold) 0deg 3deg, transparent 3deg 12deg);
    mask-image: radial-gradient(ellipse 60% 50% at 50% 54%, #000, transparent 80%);
  }

  /* ---- Cards ---- */
  .card {
    position: absolute; z-index: 3; top: 318px; width: 448px; height: 780px;
    border-radius: 26px; padding: 12px;
    background: linear-gradient(150deg, var(--team-glow), var(--team-2) 55%, var(--team-glow));
    box-shadow: 0 40px 70px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(0, 0, 0, 0.5);
  }
  .card.home { left: 62px;  transform: rotate(-4deg); }
  .card.away { right: 62px; transform: rotate(4deg); }
  .face {
    position: relative; height: 100%; border-radius: 16px; overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 34%, color-mix(in srgb, var(--team-glow) 46%, transparent), transparent 75%),
      linear-gradient(180deg, color-mix(in srgb, var(--team-2) 40%, #0c100d), #0a0d0b 72%);
    box-shadow: inset 0 0 0 1.5px rgba(217, 185, 106, 0.6);
  }
  /* Diagonal pinstripe and a foil sheen. */
  .face::before {
    content: ''; position: absolute; inset: 0; z-index: 0; opacity: 0.12;
    background: repeating-linear-gradient(135deg, transparent 0 14px, var(--team-glow) 14px 16px);
  }
  .face::after {
    content: ''; position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.16) 44%, transparent 52%,
      transparent 62%, rgba(255, 255, 255, 0.07) 68%, transparent 74%);
    mix-blend-mode: screen;
  }

  .fig { position: absolute; z-index: 2; transform: translateX(-50%); }
  /* soften a knee crop that stops short of the plate */
  .fig img { display: block; height: 100%; width: auto; mask-image: linear-gradient(#000 80%, transparent); }
  .fig.cap { z-index: 3; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.6)); }
  .fig.mate { filter: brightness(0.72) saturate(0.85) drop-shadow(0 10px 18px rgba(0, 0, 0, 0.5)); }
  .fig.framed img { aspect-ratio: 3 / 4; object-fit: cover; }
  /* x is the head within the card face, h the height */
  .fig.cap  { left: 54%; top: 86px; height: 560px; }
  .fig.mate { left: 22%; top: 70px; height: 480px; }
  .card.away .fig.cap  { left: 46%; }
  .card.away .fig.mate { left: 78%; }

  /* Seed, top corner. */
  .badge {
    position: absolute; z-index: 7; top: 18px; left: 18px;
    width: 84px; height: 84px; border-radius: 50%;
    display: grid; place-items: center; align-content: center;
    background: #0b0f0c; border: 2px solid var(--gold);
    color: var(--gold); line-height: 1;
  }
  .card.away .badge { left: auto; right: 18px; }
  .badge b { font-family: var(--display); font-weight: 700; font-size: 44px; }
  .badge i { font-style: normal; font-size: 14px; font-weight: 600; letter-spacing: 0.24em; margin-top: 2px; padding-left: 0.24em; }

  /* Name plate. */
  .plate {
    position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 22px 26px 26px;
    background: linear-gradient(180deg, rgba(10, 13, 11, 0), rgba(10, 13, 11, 0.92) 24%, #0a0d0b);
  }
  .plate .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    padding-bottom: 12px; border-bottom: 1.5px solid var(--rule-strong); }
  .team {
    font-family: var(--display); font-weight: 700; font-size: 54px; line-height: 0.9;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--paper); white-space: nowrap;
  }
  .wl { font-weight: 700; font-size: 56px; line-height: 0.82; color: var(--gold); white-space: nowrap; }
  .players { margin-top: 12px; font-size: 23px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: rgba(244, 241, 232, 0.86); white-space: nowrap; }
  .form { display: flex; gap: 7px; margin-top: 14px; }
  .chip {
    width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center;
    font-size: 20px; font-weight: 700;
    border: 1.5px solid rgba(244, 241, 232, 0.24); color: rgba(244, 241, 232, 0.5);
  }
  .chip.w { background: var(--gold); border-color: var(--gold); color: var(--chip-ink); }
  /* awarded, not played: the same result, drawn hollow */
  .chip.w.ff { background: transparent; color: var(--gold); border-style: dashed; }
  .chip.l.ff { border-style: dashed; }

  .vs {
    position: absolute; z-index: 8; left: 50%; top: 668px; transform: translate(-50%, -50%);
    width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #f8e6b4, var(--gold) 55%, #9c7c36);
    box-shadow: 0 0 0 6px var(--ink-deep), 0 16px 40px rgba(0, 0, 0, 0.7);
    font-family: var(--display); font-weight: 700; font-size: 46px; color: var(--ink-deep);
  }

  /* ---- Header and the time ---- */
  .canvas > header { position: relative; z-index: 9; flex: none; text-align: center; }
  .eyebrow { margin-top: -62px; padding-left: 0.44em; }
  .headline {
    margin-top: 16px; font-size: 92px; letter-spacing: 0.06em; padding-left: 0.06em; line-height: 0.9;
    background: linear-gradient(180deg, #f8e6b4 0%, var(--gold) 52%, #a8873e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.7)); white-space: nowrap;
  }
  .canvas > .when {
    position: relative; z-index: 9; flex: none; margin-top: auto; text-align: center;
    font-size: 40px; font-weight: 700; letter-spacing: 0.26em; padding-left: 0.26em;
    text-transform: uppercase; color: var(--paper);
  }
  .when .dot { color: var(--gold); margin: 0 0.2em; }

  .canvas > footer {
    position: relative; z-index: 9; flex: none; margin-bottom: -96px; padding-top: 40px;
    display: flex; justify-content: center; align-items: center; gap: 18px;
  }
  footer .mark { width: 46px; color: var(--gold); }
  .wordmark {
    font-family: var(--display); font-weight: 600; font-size: 23px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); white-space: nowrap;
  }
</style>
</head>
<body>
<div class="canvas grain vignette" id="canvas">
  <div class="rays"></div>
  <div class="card home" id="cardHome"></div>
  <div class="card away" id="cardAway"></div>
  <div class="vs">v</div>

  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="headline" id="title"></h1>
  </header>

  <div class="when" id="when"></div>

  <footer>
    <div class="mark mark--crest"></div>
    <div class="wordmark">Tuesday Night Tennis</div>
  </footer>
</div>

<script type="module">
const DATA = {
  kind: 'tie-preview', tie: 'QF4',
  eyebrow: 'Finals · Season 5 · 2026', title: 'Quarter Final', tag: '4th v 5th',
  subtitle: '', date: 'Tue 20 Oct', time: '8:30pm',
  sides: [
    { team: 'White', seed: '4th', pairing: 'J. Kierce & J. Virgona',
      players: [
        { name: 'Jonathan Kierce', captain: true, photo: '../cutouts/s5/jonathan-kierce.png', cutout: true },
        { name: 'Jackson Virgona', captain: false, photo: '../cutouts/s5/jackson-virgona.png', cutout: true },
      ],
      wins: 4, losses: 4, ratio: '0.79',
      form: [
        { label: 'R6', opponent: 'Pink', won: true, forfeit: false },
        { label: 'R7', opponent: 'Navy', won: true, forfeit: false },
        { label: 'R8', opponent: 'Yellow', won: false, forfeit: false },
        { label: 'R9', opponent: 'Green', won: true, forfeit: false },
        { label: 'R9', opponent: 'Red', won: true, forfeit: false },
      ] },
    { team: 'Pink', seed: '5th', pairing: 'C. Simpson & D. Maurice',
      players: [
        { name: 'Charlie Simpson', captain: true, photo: '../cutouts/s5/charlie-simpson.png', cutout: true },
        { name: 'Damon Maurice', captain: false, photo: '../cutouts/s5/damon-maurice.png', cutout: true },
      ],
      wins: 3, losses: 5, ratio: '1.16',
      form: [
        { label: 'R5', opponent: 'Brown', won: true, forfeit: false },
        { label: 'R6', opponent: 'White', won: false, forfeit: false },
        { label: 'R7', opponent: 'Orange', won: false, forfeit: false },
        { label: 'R7', opponent: 'Green', won: false, forfeit: false },
        { label: 'R9', opponent: 'Yellow', won: true, forfeit: true },
      ] },
  ],
  meeting: null, stakes: '', stakesLose: '',
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const number = (tie) => /\d+$/.exec(tie ?? '')?.[0] ?? '';

/** As large as a line goes inside its box, down to a floor. */
function fit(el, max, min, width) {
  for (let size = max; size >= min; size -= 2) {
    el.style.fontSize = `${size}px`;
    if (el.scrollWidth <= width) return;
  }
}

window.__render = function (d) {
  const [home, away] = d.sides;
  document.getElementById('eyebrow').textContent = d.eyebrow;
  const title = document.getElementById('title');
  title.textContent = `${d.title} ${number(d.tie)}`.trim();
  fit(title, 92, 60, 952);
  document.getElementById('when').innerHTML =
    [d.subtitle || d.date, d.time].filter(Boolean).map(esc).join('<span class="dot">·</span>');

  for (const [where, s] of [['Home', home], ['Away', away]]) {
    const card = document.getElementById(`card${where}`);
    card.dataset.team = s.team;
    const [cap, mate] = s.players;
    const figs = [['mate', mate], ['cap', cap]]
      .filter(([, p]) => p?.photo)
      .map(([role, p]) => `<div class="fig ${role}${p.cutout ? '' : ' framed'}"><img src="${esc(p.photo)}" alt=""></div>`)
      .join('');
    const [, n, suf] = /^(\d+)(\D*)$/.exec(s.seed) ?? [, s.seed, ''];
    const chips = s.form
      .map((f) => `<div class="chip ${f.won ? 'w' : 'l'}${f.forfeit ? ' ff' : ''}">${f.won ? 'W' : 'L'}</div>`)
      .join('');
    card.innerHTML = `<div class="face">
        ${figs}
        <div class="badge"><b>${esc(n)}</b><i>${esc(suf)}</i></div>
        <div class="plate">
          <div class="top"><div class="team">${esc(s.team)}</div><div class="wl">${s.wins}–${s.losses}</div></div>
          <div class="players">${s.players.map((p) => esc(p.name)).join(' &amp; ')}</div>
          <div class="form">${chips}</div>
        </div>
      </div>`;
    // The colour takes whatever the record leaves of the plate's width.
    const top = card.querySelector('.top');
    fit(card.querySelector('.team'), 54, 32, top.clientWidth - card.querySelector('.wl').offsetWidth - 18);
    fit(card.querySelector('.players'), 23, 16, 376);
  }
};

if (location.search.includes('guides')) document.body.classList.add('guides');
window.__render(DATA);
</script>
</body>
</html>

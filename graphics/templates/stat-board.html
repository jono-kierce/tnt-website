<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TNT — Stat board</title>
<link rel="stylesheet" href="./_tokens.css">
<link rel="stylesheet" href="./_fonts.css">
<link rel="stylesheet" href="./_assets.css">
<link rel="stylesheet" href="./_base.css">
<link rel="stylesheet" href="./_theme.css">
<style>
  header { flex: none; position: relative; }
  .eyebrow { margin-top: -64px; }
  /* Board titles are configuration, not fixed strings, so the headline keeps
     clear of the crest and `fitHeadline` below steps the size down until it
     fits. "Career Winners" at 88px would otherwise run straight under it. */
  .headline { font-size: 88px; margin-top: 16px; max-width: 770px; }
  .sub { margin-top: 12px; }
  header .mark { position: absolute; right: 0; top: -34px; width: 92px; color: var(--gold); }
  .rule-gold {
    height: 2px; margin-top: 24px;
    background: linear-gradient(90deg, var(--gold), rgba(217,185,106,0.06) 78%, transparent);
  }

  .thead {
    flex: none; display: flex; align-items: flex-end; gap: 20px;
    padding: 18px 8px 10px;
    font-size: 19px; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(244, 241, 232, 0.4);
  }
  .c-pos { width: 54px; }
  .c-bar { width: 10px; }
  .c-name { flex: 1; }
  .c-value { width: 210px; text-align: center; }

  .rows { flex: 1; display: flex; flex-direction: column; }

  .row {
    flex: 1;
    display: flex; align-items: center; gap: 20px;
    padding: 0 8px;
    border-top: 1px solid var(--rule);
  }
  .row:first-child { border-top: 0; }

  .pos {
    width: 54px; text-align: center;
    font-family: var(--display); font-weight: 600; font-size: 38px;
    color: var(--gold);
  }
  /* Only the podium is gilded; below that the rank is furniture. */
  .row:nth-child(n+4) .pos { color: rgba(244, 241, 232, 0.45); }

  .bar { width: 10px; height: 54px; border-radius: 5px; flex: none;
         background: linear-gradient(180deg, var(--team), var(--team-2)); }
  /* A player with no team in this window still gets a spine, just a mute one. */
  .row.no-team .bar { background: rgba(244, 241, 232, 0.18); }

  .who { flex: 1; min-width: 0; }
  .name { font-size: 42px; font-weight: 500; letter-spacing: 0.015em; line-height: 1.1; }
  /* Coverage — the games this number was actually recorded over. Printed
     because a blank cell means "not recorded", and a total that quietly
     skipped nine matches shouldn't look like a complete one. */
  .coverage {
    font-size: 19px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(244, 241, 232, 0.38);
    margin-top: 1px;
  }

  /* The value chip. Its fill is the ramp position, set per row as --chip. */
  .chip-wrap { width: 210px; display: flex; justify-content: center; flex: none; }
  .chip-value {
    min-width: 152px; padding: 8px 22px 10px;
    border-radius: 999px; text-align: center;
    background: var(--chip); color: var(--chip-ink);
    font-size: 42px; font-weight: 700; line-height: 1.05;
  }

  /* ==========================================================================
     Spotlight — the leader, pictured. Only when the payload carries a photo;
     without one the board above is the whole design.

     The photo bleeds off the top-right corner and dissolves into the page on
     its left and bottom edges (two masks, intersected), with the leader's team
     colour glowing up out of the dark behind it. #1 leaves the table and
     becomes the headline act; #2 onwards run beneath.
     ========================================================================== */
  .spot { display: none; }
  .lead { display: none; }

  .canvas.has-hero .spot {
    display: block;
    position: absolute; z-index: 1; top: 0; right: 0;
    width: 640px; height: 690px;
  }
  /* The team glow, behind the photo — only visible where the mask lets the
     page through, so it reads as light spilling out of the frame. */
  .spot-glow {
    position: absolute; inset: 40px -40px 60px -120px;
    background:
      radial-gradient(ellipse 55% 50% at 40% 58%,
        color-mix(in srgb, var(--team) 26%, transparent), transparent 70%);
  }
  .spot-photo {
    position: absolute; inset: 0;
    -webkit-mask-image:
      linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.3) 26%, #000 56%),
      linear-gradient(0deg, transparent 0%, #000 36%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.3) 26%, #000 56%),
      linear-gradient(0deg, transparent 0%, #000 36%);
    mask-composite: intersect;
  }
  .spot-photo img {
    width: 100%; height: 100%; display: block;
    object-fit: cover; object-position: 50% 40%;
    filter: brightness(1.12) contrast(1.08) saturate(1.06);
  }
  /* Darken the top edge so the crest reads over whatever the photo has there. */
  .spot-photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(5,11,7,0.7) 0%, rgba(5,11,7,0) 22%);
  }
  .canvas.cutout .spot-photo img { object-fit: contain; object-position: bottom center; filter: none; }

  /* Header, re-set for the left column. The title stacks — "Unforced / Errors"
     — rather than shrinking to fit a line it no longer has room for. */
  .canvas.has-hero header .mark { top: -40px; width: 84px; }
  .canvas.has-hero .headline { max-width: 540px; line-height: 0.92; }
  .canvas.has-hero .sub { max-width: 470px; font-size: 24px; line-height: 1.35; margin-top: 16px; }
  .canvas.has-hero .rule-gold { display: none; }
  .canvas.has-hero .thead { display: none; }

  .canvas.has-hero .lead {
    display: block; flex: none;
    margin-top: 40px; padding: 4px 0 6px 30px;
    max-width: 600px; position: relative;
  }
  .lead::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
    border-radius: 4px;
    background: linear-gradient(180deg, var(--team), var(--team-2));
    box-shadow: 0 0 24px color-mix(in srgb, var(--team) 50%, transparent);
  }
  .lead.no-team::before { background: rgba(244, 241, 232, 0.18); box-shadow: none; }
  .lead-kicker {
    display: flex; align-items: center; gap: 18px;
    font-family: var(--display); font-weight: 700; font-size: 22px;
    letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold);
  }
  .lead-team {
    font-family: var(--body); font-weight: 600; font-size: 20px; letter-spacing: 0.24em;
    color: rgba(244, 241, 232, 0.55);
  }
  .lead-team::before { content: '·'; margin-right: 18px; color: rgba(217, 185, 106, 0.6); }
  .lead-first {
    font-family: var(--display); font-weight: 600; font-size: 38px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-soft);
    margin-top: 16px; line-height: 1;
  }
  .lead-last {
    font-family: var(--display); font-weight: 700; font-size: 80px;
    letter-spacing: 0.03em; text-transform: uppercase; line-height: 0.95;
    white-space: nowrap; margin-top: 4px;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.55);
  }
  .lead-figure { display: flex; align-items: flex-end; gap: 22px; margin-top: 28px; }
  .lead-num {
    font-family: var(--display); font-weight: 700; font-size: 138px;
    line-height: 0.78; letter-spacing: -0.01em; color: var(--gold);
    text-shadow: 0 6px 36px rgba(0, 0, 0, 0.55);
  }
  /* Leading a board nobody wants to lead doesn't get the gold. */
  .lead.bad .lead-num { color: var(--tone-3); }
  .lead-unit {
    padding-bottom: 4px;
    font-size: 24px; font-weight: 600; letter-spacing: 0.2em; line-height: 1.25;
    text-transform: uppercase; color: rgba(244, 241, 232, 0.62);
  }
  .lead-coverage { font-size: 19px; letter-spacing: 0.12em; text-transform: uppercase;
                   color: rgba(244, 241, 232, 0.38); margin-top: 10px; }

  /* The chasing pack. A touch tighter than the plain board — seven rows where
     it had ten, but less canvas to put them in. */
  .canvas.has-hero .rows {
    margin-top: 34px; border-top: 2px solid var(--rule-strong);
  }
  .canvas.has-hero .row:first-child { border-top: 0; }
  .canvas.has-hero .name { font-size: 38px; }
  .canvas.has-hero .bar { height: 44px; }
  .canvas.has-hero .pos { font-size: 34px; }
  .canvas.has-hero .chip-value { font-size: 36px; min-width: 132px; padding: 6px 20px 8px; }
  .canvas.has-hero .coverage { font-size: 17px; }
  /* The podium is #2 and #3 now — #1 has the spotlight. */
  .canvas.has-hero .row:nth-child(n+3) .pos { color: rgba(244, 241, 232, 0.45); }

  footer {
    flex: none; display: flex; justify-content: space-between; align-items: flex-end;
    gap: 28px; padding-top: 20px; margin-bottom: -74px;
  }
  .wordmark {
    font-family: var(--display); font-weight: 600; font-size: 23px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold);
    white-space: nowrap;
  }
  /* Boards carry the longest footnotes of the three templates — coverage
     caveats stack up — so this one wraps rather than shoving the wordmark
     onto two lines. */
  footer .footnote { text-align: right; line-height: 1.4; font-size: 19px; }
</style>
</head>
<body>
<div class="canvas grain vignette" id="canvas">
  <div class="spot" id="spot">
    <div class="spot-glow"></div>
    <div class="spot-photo"><img id="spot-img" alt=""></div>
  </div>
  <header>
    <div class="mark mark--crest"></div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="headline" id="title"></h1>
    <div class="sub" id="subtitle"></div>
    <div class="rule-gold"></div>
  </header>

  <div class="lead" id="lead">
    <div class="lead-kicker"><span id="lead-rank">No. 1</span><span class="lead-team" id="lead-team"></span></div>
    <div class="lead-first" id="lead-first"></div>
    <div class="lead-last" id="lead-last"></div>
    <div class="lead-figure">
      <div class="lead-num" id="lead-num"></div>
      <div class="lead-unit" id="lead-unit"></div>
    </div>
    <div class="lead-coverage" id="lead-coverage"></div>
  </div>

  <div class="thead">
    <div class="c-pos">#</div>
    <div class="c-bar"></div>
    <div class="c-name">Player</div>
    <div class="c-value" id="metric-label"></div>
  </div>

  <div class="rows" id="rows"></div>

  <footer>
    <div class="wordmark">Tuesday Night Tennis</div>
    <div class="footnote" id="footnote"></div>
  </footer>
</div>

<script type="module">
const DATA = {
  eyebrow: 'Season 5 · 2026',
  title: 'Unforced Errors',
  subtitle: 'Per match · home & away',
  metricLabel: 'Per match',
  footnote: 'Fill-in matches excluded · Min. 4 matches',
  rows: [
    { rank: 1, player: 'Ed Simpson',      team: 'Navy',       value: '10.40', tone: 1.00, coverage: null },
    { rank: 2, player: 'Ted Angel',       team: 'Brown',      value: '9.80',  tone: 0.76, coverage: null },
    { rank: 3, player: 'Ethan Seamer',    team: 'Light Blue', value: '9.17',  tone: 0.52, coverage: null },
    { rank: 4, player: 'Jimmy Gorton',    team: 'Orange',     value: '9.00',  tone: 0.46, coverage: null },
    { rank: 5, player: 'Lachy Godden',    team: 'Orange',     value: '8.80',  tone: 0.38, coverage: null },
    { rank: 6, player: 'Charlie Simpson', team: 'Pink',       value: '8.50',  tone: 0.27, coverage: null },
    { rank: 7, player: 'Shayl Inlander',  team: 'Light Blue', value: '8.50',  tone: 0.27, coverage: '4 of 5 matches' },
    { rank: 8, player: 'Adam Dickson',    team: 'Brown',      value: '8.40',  tone: 0.00, coverage: null },
  ],
  // Relative to this file, so the sample renders straight off disk. Set
  // `hero: null` to design the plain board.
  hero: {
    player: 'Ed Simpson',
    value: '10.40',
    unit: 'Unforced Errors / match',
    photo: '../../content/photos/season-5/ed-backhand.JPG',
    cutout: false,
  },
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/**
 * Interpolate the four ramp stops declared in `_theme.css`. Reading them from
 * CSS rather than hard-coding them here keeps every colour in the stylesheet,
 * which is where the rest of the design lives.
 *
 * `getPropertyValue` on a custom property hands back the token exactly as it
 * was written — `#4fbf83`, not `rgb(79, 191, 131)` — because a custom property
 * has no type until something uses it. So parse the hex, and accept an `rgb()`
 * stop too in case someone retunes the ramp that way.
 */
function readColor(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const hex = /^#?([0-9a-f]{6})$/i.exec(raw);
  if (hex) {
    const n = parseInt(hex[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const nums = raw.match(/[\d.]+/g);
  if (nums && nums.length >= 3) return nums.slice(0, 3).map(Number);
  throw new Error(`Ramp stop ${name} is not a colour this can read: "${raw}"`);
}

const RAMP = ['--tone-0', '--tone-1', '--tone-2', '--tone-3'].map(readColor);

function toneColor(t) {
  const x = Math.min(Math.max(t, 0), 1) * (RAMP.length - 1);
  const i = Math.min(Math.floor(x), RAMP.length - 2);
  const f = x - i;
  const [a, b] = [RAMP[i], RAMP[i + 1]];
  const mix = a.map((c, j) => Math.round(c + (b[j] - c) * f));
  return `rgb(${mix.join(',')})`;
}

/**
 * Set the headline as large as it goes on one line, down to a floor. A board's
 * title comes from its spec, so "Bad Stats" and "Winners Per Set, All Time"
 * both have to land — and a headline that silently wrapped would eat a row off
 * the bottom of the table instead of complaining.
 */
function fitHeadline(el, max = 88, min = 52) {
  // Measure unwrapped: with `max-width` set, a wrapping element's scrollWidth
  // never exceeds its clientWidth, so the overflow has nothing to report.
  el.style.whiteSpace = 'nowrap';
  for (let size = max; size >= min; size -= 2) {
    el.style.fontSize = `${size}px`;
    if (el.scrollWidth <= el.clientWidth) return;
  }
  // Longer than the floor allows — let it wrap rather than run off the canvas.
  el.style.whiteSpace = 'normal';
}

/**
 * The spotlight's title stacks onto two lines in a narrow column, so it fits
 * by the longest *word* rather than the whole string: as big as it goes with
 * no word overflowing and no third line.
 */
function fitStacked(el, max = 96, min = 56) {
  el.style.whiteSpace = 'normal';
  for (let size = max; size >= min; size -= 2) {
    el.style.fontSize = `${size}px`;
    const lines = Math.round(el.scrollHeight / (size * 0.92));
    if (el.scrollWidth <= el.clientWidth && lines <= 2) return;
  }
}

/** One line, shrunk until it's no wider than `width`. */
function fitWidth(el, width, max, min) {
  for (let size = max; size >= min; size -= 2) {
    el.style.fontSize = `${size}px`;
    if (el.scrollWidth <= width) return;
  }
}

const rowHtml = (r, rank = r.rank) => `
    <div class="row ${r.team ? '' : 'no-team'}" ${r.team ? `data-team="${esc(r.team)}"` : ''}
         style="--chip: ${toneColor(r.tone)}">
      <div class="pos">${rank}</div>
      <div class="bar"></div>
      <div class="who">
        <div class="name">${esc(r.player)}</div>
        ${r.coverage ? `<div class="coverage">${esc(r.coverage)}</div>` : ''}
      </div>
      <div class="chip-wrap"><div class="chip-value">${esc(r.value)}</div></div>
    </div>`;

window.__render = function (d) {
  const canvas = document.getElementById('canvas');
  const hero = d.hero && d.rows.length ? d.hero : null;
  canvas.classList.toggle('has-hero', !!hero);
  canvas.classList.toggle('cutout', !!hero?.cutout);

  document.getElementById('eyebrow').textContent = d.eyebrow;
  const title = document.getElementById('title');
  title.textContent = d.title;
  title.style.whiteSpace = '';
  if (hero) fitStacked(title); else fitHeadline(title);
  document.getElementById('subtitle').textContent = d.subtitle;
  document.getElementById('metric-label').textContent = d.metricLabel;
  document.getElementById('footnote').textContent = d.footnote;

  // With a spotlight, #1 is up top and the table starts at #2 — unless #2 has
  // the same number, in which case the spotlight is only half the story: the
  // kicker says "Joint" and the players level with the leader print as =1.
  // Equal printed values are the test, since that's what the reader compares.
  const tied = (r) => hero && r.value === d.rows[0].value;
  document.getElementById('rows').innerHTML = (hero ? d.rows.slice(1) : d.rows)
    .map((r) => rowHtml(r, tied(r) ? '=1' : r.rank)).join('');

  if (hero) {
    const top = d.rows[0];
    const lead = document.getElementById('lead');
    const spot = document.getElementById('spot');
    for (const el of [lead, spot]) {
      if (top.team) el.dataset.team = top.team; else delete el.dataset.team;
    }
    lead.classList.toggle('no-team', !top.team);
    // Tone 1 is the bad end: leading the unforced errors takes red, not gold.
    lead.classList.toggle('bad', top.tone >= 0.5);

    const words = hero.player.trim().split(/\s+/);
    const last = words.length > 1 ? words.pop() : words[0];
    document.getElementById('lead-first').textContent = words.length && words[0] !== last ? words.join(' ') : '';
    const lastEl = document.getElementById('lead-last');
    lastEl.textContent = last;
    fitWidth(lastEl, 560, 80, 48);

    document.getElementById('lead-team').textContent = top.team ?? '';
    document.getElementById('lead-rank').textContent =
      d.rows.length > 1 && tied(d.rows[1]) ? 'Joint No. 1' : 'No. 1';
    const num = document.getElementById('lead-num');
    num.textContent = hero.value;
    fitWidth(num, 420, 138, 80);
    document.getElementById('lead-unit').innerHTML = esc(hero.unit ?? d.metricLabel).replace(/ \/ /, '<br>per ');
    document.getElementById('lead-coverage').textContent = top.coverage ?? '';
    document.getElementById('spot-img').src = hero.photo;
  }
};

if (location.search.includes('guides')) document.body.classList.add('guides');
window.__render(DATA);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TNT — Finals tie: tale of the tape</title>
<link rel="stylesheet" href="./_tokens.css">
<link rel="stylesheet" href="./_fonts.css">
<link rel="stylesheet" href="./_assets.css">
<link rel="stylesheet" href="./_base.css">
<link rel="stylesheet" href="./_theme.css">
<style>
  /* Tale of the tape: a pair down each side of the frame, the numbers down a
     frosted spine between them. Same payload as tie-preview.html. Cutouts are
     placed by head and height (see "Cutouts" in graphics/README.md). */

  .stage { position: absolute; inset: 0; z-index: 1; overflow: hidden; }

  /* Each side washed in its own team's light, from the outer edge in. */
  .wash { position: absolute; top: 0; bottom: 0; width: 62%; }
  .wash.home { left: 0;
    background: radial-gradient(ellipse 80% 58% at 22% 52%,
      color-mix(in srgb, var(--team-glow) 46%, transparent),
      color-mix(in srgb, var(--team-glow) 12%, transparent) 55%, transparent 80%); }
  .wash.away { right: 0;
    background: radial-gradient(ellipse 80% 58% at 78% 52%,
      color-mix(in srgb, var(--team-glow) 46%, transparent),
      color-mix(in srgb, var(--team-glow) 12%, transparent) 55%, transparent 80%); }
  /* A rail of team colour down each outer edge. */
  .rail { position: absolute; top: 0; bottom: 0; width: 10px; z-index: 6;
    background: linear-gradient(180deg, transparent, var(--team-glow) 20%, var(--team-2) 80%, transparent); }
  .rail.home { left: 0; }
  .rail.away { right: 0; }

  .fig {
    position: absolute; z-index: 3;
    transform: translateX(-50%);
    filter:
      drop-shadow(0 0 22px color-mix(in srgb, var(--team-glow) 34%, transparent))
      drop-shadow(0 26px 36px rgba(0, 0, 0, 0.55));
  }
  /* the knee crop dissolves before it reaches the names */
  .fig img { display: block; height: 100%; width: auto; mask-image: linear-gradient(#000 70%, transparent 92%); }
  .fig.mate { z-index: 2; filter: brightness(0.62) saturate(0.85)
    drop-shadow(0 0 18px color-mix(in srgb, var(--team-glow) 26%, transparent)); }
  .fig.framed { filter: none; }
  .fig.framed img { aspect-ratio: 3 / 4; object-fit: cover;
    mask-image: radial-gradient(ellipse 50% 50% at 50% 45%, #000 55%, transparent 100%); }

  /* Slots: x is the head, h the height of the figure box. */
  .fig.home.cap  { left: 268px; height: 720px; bottom: 230px; }
  .fig.home.mate { left: 104px; height: 620px; bottom: 380px; }
  .fig.away.cap  { left: 812px; height: 720px; bottom: 230px; }
  .fig.away.mate { left: 976px; height: 620px; bottom: 380px; }

  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 520px; z-index: 4;
    background: linear-gradient(180deg, transparent 0%, rgba(5, 11, 7, 0.75) 40%, var(--ink-deep) 70%);
  }

  /* ---- The spine ---- */
  .spine {
    position: absolute; z-index: 5; left: 50%; transform: translateX(-50%);
    top: 360px; width: 330px; height: 640px;
    display: flex; flex-direction: column;
    background: rgba(6, 12, 8, 0.66);
    backdrop-filter: blur(10px);
    border-left: 1px solid var(--rule-strong);
    border-right: 1px solid var(--rule-strong);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
  }
  .spine::before, .spine::after {
    content: ''; position: absolute; left: -1px; right: -1px; height: 3px;
    background: linear-gradient(90deg, var(--home-glow), var(--gold) 50%, var(--away-glow));
  }
  .spine::before { top: 0; }
  .spine::after { bottom: 0; }
  .row { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .row + .row { border-top: 1px solid var(--rule); }
  .row .k {
    text-align: center; font-family: var(--display); font-weight: 600;
    font-size: 17px; letter-spacing: 0.34em; padding-left: 0.34em;
    text-transform: uppercase; color: var(--gold);
  }
  .row .vs { display: grid; grid-template-columns: 1fr 1fr; margin-top: 4px; }
  .row .v {
    text-align: center; font-weight: 700; font-size: 70px; line-height: 1;
    color: var(--paper); letter-spacing: 0.01em;
  }
  .row .v sup { font-size: 0.36em; font-weight: 600; vertical-align: top; position: relative; top: 0.32em; margin-left: 2px; letter-spacing: 0.04em; }
  .row .v.sets { font-size: 58px; }

  /* ---- Header ---- */
  .canvas > header { position: relative; z-index: 7; flex: none; text-align: center; }
  .eyebrow { margin-top: -62px; padding-left: 0.44em; }
  .headline {
    margin-top: 16px;
    font-size: 96px; letter-spacing: 0.06em; padding-left: 0.06em; line-height: 0.9;
    background: linear-gradient(180deg, #f8e6b4 0%, var(--gold) 52%, #a8873e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.7));
    white-space: nowrap;
  }
  .when {
    margin-top: 16px; font-size: 28px; font-weight: 600; letter-spacing: 0.3em; padding-left: 0.3em;
    text-transform: uppercase; color: var(--paper); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
  }
  .when .dot { color: var(--gold); margin: 0 0.25em; }

  /* ---- Names under each pair ---- */
  .canvas > .names { position: relative; z-index: 7; margin-top: auto; flex: none;
    display: grid; grid-template-columns: 1fr 1fr; gap: 300px; }
  .side.away { text-align: right; }
  .team {
    font-family: var(--display); font-weight: 700; font-size: 58px; line-height: 1;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--paper); white-space: nowrap;
  }
  .team::after {
    content: ''; display: block; height: 5px; width: 88px; margin-top: 12px; border-radius: 3px;
    background: linear-gradient(90deg, var(--team-glow), var(--team-2));
  }
  .side.away .team::after { margin-left: auto; background: linear-gradient(270deg, var(--team-glow), var(--team-2)); }
  .players { margin-top: 12px; font-size: 26px; font-weight: 500; letter-spacing: 0.05em; line-height: 1.25;
    color: rgba(244, 241, 232, 0.8); white-space: nowrap; }

  .canvas > footer {
    position: relative; z-index: 7; flex: none; margin-bottom: -96px; padding-top: 34px;
    display: flex; justify-content: center; align-items: center; gap: 18px;
  }
  footer .mark { width: 46px; color: var(--gold); }
  .wordmark {
    font-family: var(--display); font-weight: 600; font-size: 23px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); white-space: nowrap;
  }
</style>
</head>
<body>
<div class="canvas grain vignette" id="canvas">
  <div class="stage">
    <div class="wash home" id="washHome"></div>
    <div class="wash away" id="washAway"></div>
    <div class="rail home" id="railHome"></div>
    <div class="rail away" id="railAway"></div>
    <div id="figs"></div>
    <div class="floor"></div>
    <div class="spine" id="spine"></div>
  </div>

  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="headline" id="title"></h1>
    <div class="when" id="when"></div>
  </header>

  <div class="names">
    <div class="side home" id="sideHome"></div>
    <div class="side away" id="sideAway"></div>
  </div>

  <footer>
    <div class="mark mark--crest"></div>
    <div class="wordmark">Tuesday Night Tennis</div>
  </footer>
</div>

<script type="module">
const DATA = {
  kind: 'tie-preview', tie: 'QF1',
  eyebrow: 'Finals · Season 5 · 2026', title: 'Quarter Final', tag: '1st v 8th',
  subtitle: '', date: 'Tue 20 Oct', time: '7:50pm',
  sides: [
    { team: 'Yellow', seed: '1st', pairing: 'L. Sharrock & J. Raines',
      players: [
        { name: 'Luke Sharrock', captain: true, photo: '../cutouts/s5/luke-sharrock.png', cutout: true },
        { name: 'Jack Raines', captain: false, photo: '../cutouts/s5/jack-raines.png', cutout: true },
      ],
      wins: 7, losses: 1, ratio: '1.64', form: [] },
    { team: 'Orange', seed: '8th', pairing: 'J. Gorton & L. Godden',
      players: [
        { name: 'Jimmy Gorton', captain: true, photo: '../cutouts/s5/jimmy-gorton-2.png', cutout: true },
        { name: 'Lachy Godden', captain: false, photo: '../cutouts/s5/lachy-godden-2.png', cutout: true },
      ],
      wins: 3, losses: 5, ratio: '0.81', form: [] },
  ],
  meeting: { label: 'Round 6', winner: 'Yellow', sets: [{ a: 6, b: 2, tbA: null, tbB: null }], note: null },
  stakes: 'Winner plays White or Pink in SF1', stakesLose: 'Loser’s season is over',
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tb = (n) => (n === null || n === undefined ? '' : `<span class="tb">${n}</span>`);
const number = (tie) => /\d+$/.exec(tie ?? '')?.[0] ?? '';
const seed = (s) => {
  const [, n, suf] = /^(\d+)(\D*)$/.exec(s) ?? [, s, ''];
  return `${esc(n)}<sup>${esc(suf)}</sup>`;
};

/** As large as a line goes without wrapping, down to a floor. */
function fit(el, max, min) {
  for (let size = max; size >= min; size -= 2) {
    el.style.fontSize = `${size}px`;
    if (el.scrollWidth <= el.clientWidth) return;
  }
}

window.__render = function (d) {
  const [home, away] = d.sides;
  const canvas = document.getElementById('canvas');
  // The spine's top and bottom rules run from one team's colour to the other's.
  const glow = (team) => {
    const probe = document.createElement('div');
    probe.dataset.team = team; probe.style.display = 'none';
    document.body.append(probe);
    const c = getComputedStyle(probe).getPropertyValue('--team-glow');
    probe.remove();
    return c;
  };
  canvas.style.setProperty('--home-glow', glow(home.team));
  canvas.style.setProperty('--away-glow', glow(away.team));

  document.getElementById('eyebrow').textContent = d.eyebrow;
  const title = document.getElementById('title');
  title.textContent = `${d.title} ${number(d.tie)}`.trim();
  fit(title, 96, 64);
  const when = [d.subtitle || d.date, d.time].filter(Boolean);
  document.getElementById('when').innerHTML = when.map(esc).join('<span class="dot">·</span>');

  for (const [id, s] of [['Home', home], ['Away', away]]) {
    document.getElementById(`wash${id}`).dataset.team = s.team;
    document.getElementById(`rail${id}`).dataset.team = s.team;
  }

  // Figures: partner first so the captain stands in front.
  const figs = [];
  for (const [where, s] of [['home', home], ['away', away]]) {
    const [cap, mate] = s.players;
    for (const [role, p] of [['mate', mate], ['cap', cap]]) {
      if (!p?.photo) continue;
      figs.push(`<div class="fig ${where} ${role}${p.cutout ? '' : ' framed'}" data-team="${esc(s.team)}">
        <img src="${esc(p.photo)}" alt=""></div>`);
    }
  }
  document.getElementById('figs').innerHTML = figs.join('');

  // The spine: home's number on the left, away's on the right, always.
  const rows = [
    ['Seed', seed(home.seed), seed(away.seed)],
    ['Record', `${home.wins}–${home.losses}`, `${away.wins}–${away.losses}`],
    ['Ratio', esc(home.ratio), esc(away.ratio)],
  ];
  const m = d.meeting;
  if (m) {
    // Winner's sets first in the payload; turned round to home-left here.
    const homeWon = m.winner === home.team;
    const games = (mine) => m.sets.map((s) => (mine === homeWon ? `${s.a}${tb(s.tbA)}` : `${s.b}${tb(s.tbB)}`)).join(' ');
    rows.push([m.label, games(true), games(false), m.sets.length > 1 ? 'sets' : '']);
  }
  document.getElementById('spine').innerHTML = rows
    .map(([k, a, b, cls = '']) => `<div class="row"><div class="k">${esc(k)}</div>
      <div class="vs"><div class="v ${cls}">${a}</div><div class="v ${cls}">${b}</div></div></div>`)
    .join('');

  const side = (el, s) => {
    el.dataset.team = s.team;
    el.innerHTML = `<div class="team">${esc(s.team)}</div>
      <div class="players">${s.players.map((p) => esc(p.name)).join('<br>')}</div>`;
    fit(el.querySelector('.team'), 58, 36);
  };
  side(document.getElementById('sideHome'), home);
  side(document.getElementById('sideAway'), away);
};

if (location.search.includes('guides')) document.body.classList.add('guides');
window.__render(DATA);
</script>
</body>
</html>

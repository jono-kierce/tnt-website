<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TNT — Result (C / Honours board)</title>
<link rel="stylesheet" href="../../templates/_tokens.css">
<link rel="stylesheet" href="../../templates/_fonts.css">
<link rel="stylesheet" href="../../templates/_assets.css">
<link rel="stylesheet" href="../../templates/_base.css">
<link rel="stylesheet" href="_theme.css">
<style>
  .canvas { padding: 0; }

  /* The photo is a plate at the top of the card and the score is printed on
     the paper below it — the light direction's answer to the frosted panel. */
  .plate { position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 792px; overflow: hidden; }
  .photo { position: absolute; inset: 0; background: var(--green) center/cover no-repeat; }
  .photo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(10,19,13,0.62) 0%, rgba(10,19,13,0.06) 26%,
      rgba(10,19,13,0.00) 62%, rgba(242,237,224,0.42) 89%, var(--board) 100%);
  }
  .canvas.no-photo .photo {
    background: linear-gradient(170deg, #16281c, var(--green));
  }
  .canvas.no-photo .ghost { display: block; }
  .ghost {
    display: none; position: absolute; z-index: 2;
    width: 430px; left: 50%; top: 190px; transform: translateX(-50%);
    color: var(--board); opacity: 0.16;
  }

  .topbar {
    position: absolute; z-index: 3; left: var(--safe); right: var(--safe); top: 70px;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--board);
  }
  .topbar .eyebrow { color: var(--gold-soft); }
  .topbar .mark { width: 56px; color: var(--board); }

  /* Everything below the plate is print on paper. */
  .sheet {
    position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; top: 756px;
    padding: 0 var(--safe) 74px;
    display: flex; flex-direction: column;
  }

  .stage {
    text-align: center;
    font-family: var(--display); font-weight: 700; font-size: 84px; line-height: 0.94;
    color: var(--green);
  }
  .stage-rule {
    height: 1px; margin: 20px 0 4px;
    background: linear-gradient(90deg, transparent, var(--gold-ink) 24%, var(--gold-ink) 76%, transparent);
  }

  .sides { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .side {
    display: flex; align-items: center; gap: 22px;
    padding: 24px 0;
  }
  .side + .side { border-top: 1px solid var(--rule); }

  .seed {
    width: 46px; flex: none; text-align: center;
    font-family: var(--body); font-weight: 600; font-size: 28px; color: var(--faded);
  }
  .chip {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    background: linear-gradient(150deg, var(--team), var(--team-2));
    box-shadow: 0 0 0 1.5px rgba(10, 19, 13, 0.32), 0 1px 2px rgba(10, 19, 13, 0.18);
  }
  .names { flex: 1; font-size: 50px; font-weight: 600; }

  .sets { display: flex; gap: 24px; flex: none; }
  .set {
    width: 62px; text-align: center;
    font-size: 62px; font-weight: 700; line-height: 1; color: var(--faded);
  }
  .set.won { color: var(--green); }

  .side.won .seed { color: var(--gold-ink); font-weight: 700; }
  .side.won .names { font-weight: 700; }
  /* Champion's tick: a gold rule down the left of the winning line. */
  .side.won { position: relative; }
  .side.won::before {
    content: ''; position: absolute; left: -22px;
    top: 12px; bottom: 12px; width: 4px; background: var(--gold-ink);
  }
  .side.lost .names, .side.lost .seed { color: var(--green-soft); }
  .side.lost .chip { opacity: 0.8; }

  /* In the sheet's flow, not absolutely placed: an element selector would lose
     to the theme's `.canvas > *` rule and fall back into the layout. */
  .card-footer {
    flex: none; display: flex; justify-content: space-between; align-items: baseline;
    padding-top: 22px; border-top: 1px solid var(--rule);
  }
  .wordmark {
    font-family: var(--body); font-weight: 600; font-size: 19px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--green-soft);
  }
</style>
</head>
<body>
<div class="canvas grain" id="canvas">
  <div class="plate">
    <div class="photo" id="photo"></div>
  </div>
  <div class="mark mark--crest ghost"></div>

  <div class="topbar">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="mark mark--crest"></div>
  </div>

  <div class="sheet">
    <div class="stage" id="stage"></div>
    <div class="stage-rule"></div>
    <div class="sides" id="sides"></div>
    <div class="card-footer">
      <div class="wordmark">Tuesday Night Tennis</div>
      <div class="footnote" id="footnote"></div>
    </div>
  </div>
</div>

<script type="module">
const DATA = {
  eyebrow: 'Season 4 · 2025',
  roundLabel: 'Grand Final',
  photo: null,
  sides: [
    { team: 'Pink',  pairing: 'L. Sharrock & A. Hume', seed: 1, won: true,
      sets: [{ games: '6', tiebreak: null, won: true }, { games: '7', tiebreak: null, won: true }] },
    { team: 'White', pairing: 'J. Kierce & L. Godden', seed: 7, won: false,
      sets: [{ games: '4', tiebreak: null, won: false }, { games: '6', tiebreak: '3', won: false }] },
  ],
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const setHtml = (s) =>
  `<div class="set ${s.won ? 'won' : 'lost'}">${esc(s.games)}${s.tiebreak ? `<span class="tb">${esc(s.tiebreak)}</span>` : ''}</div>`;

window.__render = function (d) {
  const canvas = document.getElementById('canvas');
  canvas.classList.toggle('no-photo', !d.photo);
  document.getElementById('photo').style.backgroundImage = d.photo ? `url("${d.photo}")` : '';

  document.getElementById('eyebrow').textContent = d.eyebrow;
  document.getElementById('stage').textContent = d.roundLabel;
  document.getElementById('footnote').textContent = d.eyebrow;

  document.getElementById('sides').innerHTML = d.sides.map((s) => `
    <div class="side ${s.won ? 'won' : 'lost'}" data-team="${esc(s.team)}">
      <div class="seed">${s.seed ?? ''}</div>
      <div class="chip"></div>
      <div class="names">${esc(s.pairing)}</div>
      <div class="sets">${s.sets.map(setHtml).join('')}</div>
    </div>`).join('');
};

if (location.search.includes('guides')) document.body.classList.add('guides');
window.__render(DATA);
</script>
</body>
</html>

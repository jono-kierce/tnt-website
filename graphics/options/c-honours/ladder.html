<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TNT — Ladder (C / Honours board)</title>
<link rel="stylesheet" href="../../templates/_tokens.css">
<link rel="stylesheet" href="../../templates/_fonts.css">
<link rel="stylesheet" href="../../templates/_assets.css">
<link rel="stylesheet" href="../../templates/_base.css">
<link rel="stylesheet" href="_theme.css">
<style>
  header { flex: none; text-align: center; }
  header .mark { width: 86px; color: var(--green); margin: -84px auto 16px; opacity: 0.9; }
  .eyebrow { }
  .headline { font-size: 104px; margin-top: 4px; }
  .sub { margin-top: 12px; }
  .rule-gold {
    height: 1px; margin: 24px 0 0;
    background: linear-gradient(90deg, transparent, var(--gold-ink) 22%, var(--gold-ink) 78%, transparent);
  }

  .thead {
    flex: none; display: flex; align-items: flex-end; gap: 20px;
    padding: 16px 6px 10px;
    font-family: var(--body); font-size: 17px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--faded);
  }
  .c-pos { width: 54px; text-align: center; }
  .c-chip { width: 22px; }
  .c-team { flex: 1; }
  .c-num { width: 74px; text-align: center; }
  .c-ratio { width: 112px; text-align: right; }

  .rows { flex: 1; display: flex; flex-direction: column; }

  .row {
    flex: 1;
    display: flex; align-items: center; gap: 20px;
    padding: 0 6px;
    border-bottom: 1px solid var(--rule);
    position: relative;
  }
  .row:last-child { border-bottom: 0; }

  .pos {
    width: 54px; text-align: center;
    font-family: var(--body); font-weight: 600; font-size: 34px; color: var(--green-soft);
  }
  /* Roundel, not a bar — a ball on a club board. The ring is load-bearing:
     without it the White and Yellow teams vanish into the paper. */
  .chip {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    background: linear-gradient(150deg, var(--team), var(--team-2));
    box-shadow: 0 0 0 1.5px rgba(10, 19, 13, 0.32), 0 1px 2px rgba(10, 19, 13, 0.18);
  }
  .team {
    flex: 1; font-size: 46px; font-weight: 600; letter-spacing: 0.005em;
  }
  .num { width: 74px; text-align: center; font-size: 42px; font-weight: 600; }
  .ratio {
    width: 112px; text-align: right; font-size: 42px; font-weight: 700; color: var(--gold-ink);
  }

  /* Champion's line: gold leaf across the row, ink stays green. */
  .row.lead::before {
    content: '';
    position: absolute; inset: 1px -6px;
    background: linear-gradient(90deg, rgba(168,128,46,0.20), rgba(168,128,46,0.07) 62%, rgba(168,128,46,0.02));
    border-left: 4px solid var(--gold-ink);
  }
  .row.lead > * { position: relative; }
  .row.lead .pos { color: var(--gold-ink); font-weight: 700; }
  .row.lead .team { font-weight: 700; }

  /* Below the cut: the ink lifts to a warm grey. Nothing is hidden. */
  .row.missed .pos, .row.missed .team, .row.missed .num { color: var(--faded); }
  .row.missed .ratio { color: var(--faded); font-weight: 600; }
  .row.missed .chip { opacity: 0.72; }

  .cutline {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 0 6px; margin: 3px 0;
    font-family: var(--body); font-size: 15px; font-weight: 600;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-ink);
  }
  .cutline::before, .cutline::after { content: ''; height: 1px; background: var(--rule-strong); }
  .cutline::before { width: 54px; }
  .cutline::after { flex: 1; }

  footer {
    flex: none; display: flex; justify-content: space-between; align-items: flex-end;
    padding-top: 20px; margin-bottom: -74px;
    border-top: 1px solid var(--rule);
  }
  .wordmark {
    font-family: var(--body); font-weight: 600; font-size: 20px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--green-soft);
    padding-top: 18px;
  }
  footer .footnote { padding-top: 18px; }
</style>
</head>
<body>
<div class="canvas grain vignette">
  <header>
    <div class="mark mark--crest"></div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="headline" id="title"></h1>
    <div class="sub" id="subtitle"></div>
    <div class="rule-gold"></div>
  </header>

  <div class="thead">
    <div class="c-pos">#</div>
    <div class="c-chip"></div>
    <div class="c-team">Team</div>
    <div class="c-num">P</div>
    <div class="c-num">W</div>
    <div class="c-ratio">Ratio</div>
  </div>

  <div class="rows" id="rows"></div>

  <footer>
    <div class="wordmark">Tuesday Night Tennis</div>
    <div class="footnote" id="footnote"></div>
  </footer>
</div>

<script type="module">
const DATA = {
  eyebrow: 'Season 4 · 2025',
  title: 'Final Ladder',
  subtitle: 'Home & away complete · Top 8 play finals',
  footnote: 'Ratio = games won ÷ games lost',
  finalsCutoff: 8,
  rows: [
    { rank: 1, team: 'Pink',       pairing: 'L. Sharrock & A. Hume',    played: 8, wins: 8, ratio: '1.67', qualifies: true },
    { rank: 2, team: 'Green',      pairing: 'A. Dickson & D. Croucher', played: 8, wins: 6, ratio: '1.52', qualifies: true },
    { rank: 3, team: 'Orange',     pairing: 'J. Gorton & E. Simpson',   played: 8, wins: 5, ratio: '1.33', qualifies: true },
    { rank: 4, team: 'Red',        pairing: 'Q. Feikema & W. Burgess',  played: 8, wins: 5, ratio: '1.21', qualifies: true },
    { rank: 5, team: 'Navy',       pairing: 'L. Jenkin & J. Virgona',   played: 8, wins: 4, ratio: '0.95', qualifies: true },
    { rank: 6, team: 'Light Blue', pairing: 'S. Inlander & E. Seamer',  played: 8, wins: 3, ratio: '0.58', qualifies: true },
    { rank: 7, team: 'White',      pairing: 'J. Kierce & L. Godden',    played: 8, wins: 2, ratio: '0.85', qualifies: true },
    { rank: 8, team: 'Black',      pairing: 'E. Wise & L. Mossman',     played: 8, wins: 2, ratio: '0.78', qualifies: true },
    { rank: 9, team: 'Yellow',     pairing: 'A. Littlejohn & W. Mumme', played: 8, wins: 1, ratio: '0.69', qualifies: false },
  ],
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

window.__render = function (d) {
  document.getElementById('eyebrow').textContent = d.eyebrow;
  document.getElementById('title').textContent = d.title;
  document.getElementById('subtitle').textContent = d.subtitle;
  document.getElementById('footnote').textContent = d.footnote;

  const html = [];
  d.rows.forEach((r, i) => {
    if (i === d.finalsCutoff) html.push(`<div class="cutline">Finals cut</div>`);
    html.push(`
      <div class="row ${r.rank === 1 ? 'lead' : ''} ${r.qualifies ? '' : 'missed'}" data-team="${esc(r.team)}">
        <div class="pos">${r.rank}</div>
        <div class="chip"></div>
        <div class="team">${esc(r.pairing)}</div>
        <div class="num">${r.played}</div>
        <div class="num">${r.wins}</div>
        <div class="ratio">${esc(r.ratio)}</div>
      </div>`);
  });
  document.getElementById('rows').innerHTML = html.join('');
};

if (location.search.includes('guides')) document.body.classList.add('guides');
window.__render(DATA);
</script>
</body>
</html>

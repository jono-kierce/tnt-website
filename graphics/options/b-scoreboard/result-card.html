<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TNT — Result (B / Scoreboard)</title>
<link rel="stylesheet" href="../../templates/_tokens.css">
<link rel="stylesheet" href="../../templates/_fonts.css">
<link rel="stylesheet" href="../../templates/_assets.css">
<link rel="stylesheet" href="../../templates/_base.css">
<link rel="stylesheet" href="_theme.css">
<style>
  .canvas { padding: 0; }

  .photo { position: absolute; inset: 0; z-index: 0; background: var(--ink-deep) center/cover no-repeat; }
  .photo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(5,11,7,0.80) 0%, rgba(5,11,7,0.16) 24%,
      rgba(5,11,7,0.10) 44%, rgba(5,11,7,0.66) 100%);
  }
  .canvas.no-photo .photo { background: linear-gradient(180deg, #101d15, var(--ink-deep)); }
  .canvas.no-photo .ghost { display: block; }
  .ghost {
    display: none; position: absolute; z-index: 1;
    width: 560px; left: 50%; top: 300px; transform: translateX(-50%);
    color: var(--paper); opacity: 0.06;
  }

  .topbar {
    position: absolute; z-index: 3; left: var(--safe); right: var(--safe); top: 72px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar .mark { width: 62px; color: var(--gold); }

  /* The stage sits big over the photo — at a thumbnail this is the only word
     that survives, so it's the one that has to be there. */
  .stage {
    position: absolute; z-index: 3; left: var(--safe); right: var(--safe); bottom: 636px;
    font-family: var(--display); font-size: 104px; line-height: 0.84;
    text-transform: uppercase; letter-spacing: -0.005em;
    text-shadow: 0 6px 40px rgba(0, 0, 0, 0.6);
  }

  /* Frosted scoreboard — the same slab language as the ladder. */
  .panel {
    position: absolute; z-index: 3; left: 0; right: 0; bottom: 0;
    padding: 34px var(--safe) 146px;
    background: rgba(6, 12, 8, 0.46);
    backdrop-filter: blur(34px) saturate(118%);
    -webkit-backdrop-filter: blur(34px) saturate(118%);
  }

  .side {
    display: flex; align-items: stretch;
    background: var(--slab);
    border-radius: 6px; overflow: hidden;
    min-height: 148px;
  }
  .side + .side { margin-top: 10px; }

  .block {
    width: 104px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--team), var(--team-2));
    color: var(--team-ink);
    font-family: var(--display); font-size: 46px; line-height: 1; padding-top: 4px;
  }
  .body { flex: 1; display: flex; align-items: center; gap: 22px; padding: 0 26px 0 24px; }
  .names { flex: 1; font-size: 46px; font-weight: 500; line-height: 1.08; }
  .sets { display: flex; gap: 22px; flex: none; }
  .set {
    width: 68px; text-align: center;
    font-family: var(--display); font-size: 66px; line-height: 1; padding-top: 4px;
    color: rgba(244, 241, 232, 0.42);
  }
  .set.won { color: var(--paper); }

  /* The winner takes the team colour, the same move the ladder leader makes. */
  .side.won { background: linear-gradient(100deg, var(--team), var(--team-2)); color: var(--team-ink); }
  .side.won .block { background: rgba(0, 0, 0, 0.18); }
  .side.won .set { color: color-mix(in srgb, var(--team-ink) 45%, transparent); }
  .side.won .set.won { color: var(--team-ink); }
  .side.won .names { font-weight: 600; }
  .side.lost .names { color: var(--dim-ink); }
</style>
</head>
<body>
<div class="canvas grain" id="canvas">
  <div class="photo" id="photo"></div>
  <div class="mark mark--crest ghost"></div>

  <div class="topbar">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="mark mark--crest"></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="panel">
    <div id="sides"></div>
  </div>
</div>

<script type="module">
const DATA = {
  eyebrow: 'Season 4 · 2025',
  roundLabel: 'Grand Final',
  photo: null,
  sides: [
    { team: 'Pink',  pairing: 'L. Sharrock & A. Hume', seed: 1, won: true,
      sets: [{ games: '6', tiebreak: null, won: true }, { games: '7', tiebreak: null, won: true }] },
    { team: 'White', pairing: 'J. Kierce & L. Godden', seed: 7, won: false,
      sets: [{ games: '4', tiebreak: null, won: false }, { games: '6', tiebreak: '3', won: false }] },
  ],
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const setHtml = (s) =>
  `<div class="set ${s.won ? 'won' : 'lost'}">${esc(s.games)}${s.tiebreak ? `<span class="tb">${esc(s.tiebreak)}</span>` : ''}</div>`;

window.__render = function (d) {
  const canvas = document.getElementById('canvas');
  canvas.classList.toggle('no-photo', !d.photo);
  document.getElementById('photo').style.backgroundImage = d.photo ? `url("${d.photo}")` : '';

  document.getElementById('eyebrow').textContent = d.eyebrow;
  document.getElementById('stage').textContent = d.roundLabel;

  document.getElementById('sides').innerHTML = d.sides.map((s) => `
    <div class="side ${s.won ? 'won' : 'lost'}" data-team="${esc(s.team)}">
      <div class="block">${s.seed ?? ''}</div>
      <div class="body">
        <div class="names">${esc(s.pairing)}</div>
        <div class="sets">${s.sets.map(setHtml).join('')}</div>
      </div>
    </div>`).join('');
};

if (location.search.includes('guides')) document.body.classList.add('guides');
window.__render(DATA);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TNT — Ladder (B / Scoreboard)</title>
<link rel="stylesheet" href="../../templates/_tokens.css">
<link rel="stylesheet" href="../../templates/_fonts.css">
<link rel="stylesheet" href="../../templates/_assets.css">
<link rel="stylesheet" href="../../templates/_base.css">
<link rel="stylesheet" href="_theme.css">
<style>
  header { flex: none; display: flex; align-items: flex-start; gap: 20px; }
  .eyebrow { margin-top: -62px; }
  .headline { font-size: 132px; margin-top: 10px; }
  .sub { margin-top: 16px; }
  header .mark { width: 108px; color: var(--gold); flex: none; margin: -46px 0 0 auto; }

  .thead {
    flex: none; display: flex; align-items: flex-end; gap: 10px;
    padding: 26px 22px 10px 132px;
    font-size: 18px; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: rgba(244, 241, 232, 0.34);
  }
  .c-team { flex: 1; }
  .c-p { width: 74px; text-align: center; }
  .c-w { width: 108px; text-align: center; }
  .c-ratio { width: 128px; text-align: right; }

  .rows { flex: 1; display: flex; flex-direction: column; gap: 9px; }

  /* One slab per team. The colour block on the left is the row's spine — it's
     what's left of the design once Instagram shrinks it to a thumbnail. */
  .row {
    flex: 1;
    display: flex; align-items: stretch;
    background: var(--slab);
    border-radius: 6px;
    overflow: hidden;
  }
  .block {
    width: 112px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--team), var(--team-2));
    color: var(--team-ink);
    font-family: var(--display); font-size: 52px; line-height: 1;
    padding-top: 4px; /* Anton sits high in its box */
  }
  .body {
    flex: 1; display: flex; align-items: center; gap: 10px;
    padding: 0 22px 0 20px;
  }

  .team { flex: 1; font-size: 40px; font-weight: 500; letter-spacing: 0.005em; }
  .p { width: 74px; text-align: center; font-size: 34px; font-weight: 400; color: rgba(244,241,232,0.6); }
  /* Wins is what the ladder sorts on, so wins is the number that gets the size. */
  .w { width: 108px; text-align: center; font-family: var(--display); font-size: 56px; line-height: 1; padding-top: 4px; }
  .ratio { width: 128px; text-align: right; font-size: 38px; font-weight: 600; color: var(--gold-soft); }

  /* Leader: the slab becomes the team's colour outright. */
  .row.lead { background: linear-gradient(100deg, var(--team), var(--team-2)); color: var(--team-ink); }
  .row.lead .block { background: rgba(0, 0, 0, 0.18); color: var(--team-ink); }
  .row.lead .p { color: color-mix(in srgb, var(--team-ink) 62%, transparent); }
  .row.lead .ratio { color: var(--team-ink); }
  .row.lead .team { font-weight: 600; }

  /* Missed the eight. The slab drops out and the colour block narrows to an
     edge — "below the line" said structurally. The text keeps full contrast,
     because a dimmed row is a row nobody can read on a court in February. */
  .row.missed { background: transparent; box-shadow: inset 0 0 0 2px var(--slab); }
  .row.missed .block {
    width: 112px; background: none; color: rgba(244, 241, 232, 0.45);
    font-size: 44px; position: relative;
  }
  .row.missed .block::before {
    content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 12px;
    border-radius: 0 6px 6px 0;
    background: linear-gradient(180deg, var(--team), var(--team-2));
  }
  .row.missed .team, .row.missed .w { color: var(--dim-ink); }
  .row.missed .ratio { color: rgba(244, 241, 232, 0.55); }

  /* The cut, drawn as a gap in the stack with the rule through it. */
  .cutline {
    flex: none; display: flex; align-items: center; gap: 14px;
    margin: 5px 0 3px;
    font-size: 17px; font-weight: 600; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--gold);
  }
  .cutline::before, .cutline::after { content: ''; height: 2px; background: rgba(217,185,106,0.4); }
  .cutline::before { width: 98px; }
  .cutline::after { flex: 1; }

  footer {
    flex: none; display: flex; justify-content: space-between; align-items: flex-end;
    padding-top: 22px; margin-bottom: -74px;
  }
  .wordmark {
    font-family: var(--display); font-size: 26px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold);
  }
</style>
</head>
<body>
<div class="canvas grain vignette">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="headline" id="title"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="mark mark--crest"></div>
  </header>

  <div class="thead">
    <div class="c-team">Team</div>
    <div class="c-p">P</div>
    <div class="c-w">W</div>
    <div class="c-ratio">Ratio</div>
  </div>

  <div class="rows" id="rows"></div>

  <footer>
    <div class="wordmark">Tuesday Night Tennis</div>
    <div class="footnote" id="footnote"></div>
  </footer>
</div>

<script type="module">
const DATA = {
  eyebrow: 'Season 4 · 2025',
  title: 'Standings',
  subtitle: 'Home & away complete · Top 8 play finals',
  footnote: 'Ratio = games won ÷ games lost',
  finalsCutoff: 8,
  rows: [
    { rank: 1, team: 'Pink',       pairing: 'L. Sharrock & A. Hume',    played: 8, wins: 8, ratio: '1.67', qualifies: true },
    { rank: 2, team: 'Green',      pairing: 'A. Dickson & D. Croucher', played: 8, wins: 6, ratio: '1.52', qualifies: true },
    { rank: 3, team: 'Orange',     pairing: 'J. Gorton & E. Simpson',   played: 8, wins: 5, ratio: '1.33', qualifies: true },
    { rank: 4, team: 'Red',        pairing: 'Q. Feikema & W. Burgess',  played: 8, wins: 5, ratio: '1.21', qualifies: true },
    { rank: 5, team: 'Navy',       pairing: 'L. Jenkin & J. Virgona',   played: 8, wins: 4, ratio: '0.95', qualifies: true },
    { rank: 6, team: 'Light Blue', pairing: 'S. Inlander & E. Seamer',  played: 8, wins: 3, ratio: '0.58', qualifies: true },
    { rank: 7, team: 'White',      pairing: 'J. Kierce & L. Godden',    played: 8, wins: 2, ratio: '0.85', qualifies: true },
    { rank: 8, team: 'Black',      pairing: 'E. Wise & L. Mossman',     played: 8, wins: 2, ratio: '0.78', qualifies: true },
    { rank: 9, team: 'Yellow',     pairing: 'A. Littlejohn & W. Mumme', played: 8, wins: 1, ratio: '0.69', qualifies: false },
  ],
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

window.__render = function (d) {
  document.getElementById('eyebrow').textContent = d.eyebrow;
  document.getElementById('title').textContent = d.title;
  document.getElementById('subtitle').textContent = d.subtitle;
  document.getElementById('footnote').textContent = d.footnote;

  const html = [];
  d.rows.forEach((r, i) => {
    if (i === d.finalsCutoff) html.push(`<div class="cutline">Finals cut</div>`);
    html.push(`
      <div class="row ${r.rank === 1 ? 'lead' : ''} ${r.qualifies ? '' : 'missed'}" data-team="${esc(r.team)}">
        <div class="block">${r.rank}</div>
        <div class="body">
          <div class="team">${esc(r.pairing)}</div>
          <div class="p">${r.played}</div>
          <div class="w">${r.wins}</div>
          <div class="ratio">${esc(r.ratio)}</div>
        </div>
      </div>`);
  });
  document.getElementById('rows').innerHTML = html.join('');
};

if (location.search.includes('guides')) document.body.classList.add('guides');
window.__render(DATA);
</script>
</body>
</html>
